<style>

    --bg: #0B0E1A;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {

    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);

    border: 0.5px solid var(--border); border-radius: 20px;

  .login-icon { font-size: 30px; margin-bottom: 20px; color: var(--gold-light); }

  .toolbar { display: flex; gap: 6px; }

  /* ── CHAT ── */
  .chat-window {
    flex: 1; overflow-y: auto; padding: 24px 18px;

  }

  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }

  .msg.user .bubble {

  .msg.assistant .bubble {

  .msg-label { font-size: 10px; color: var(--text-muted); padding: 0 4px; }

  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {

  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ── INPUT ── */
  .input-bar {
    display: flex; align-items: flex-end; gap: 10px;

<script>

function checkPassword() {

  var error = document.getElementById('loginError');
  if (input === 'Gkgk0681') {
    document.getElementById('loginOverlay').classList.add('hidden');

  } else {

    document.getElementById('passwordInput').value = '';
  }
}

// 若從 Manager Portal 入口頁的授權連結進入，自動放行，不用再輸入一次密碼
(function tryAutoAuth() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('auth') === 'Gkgk0681') {
    sessionStorage.setItem('mp_auth', '1');
    var cleanUrl = window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);
  }
})();

if (sessionStorage.getItem('mp_auth') === '1') {
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.getElementById('loginOverlay');
    if (o) o.classList.add('hidden');
  });
}

// ============================================
// System Prompt（v1 通用版，無知識庫）
// ============================================
const SYSTEM_PROMPT = `你是 AI HR 夥伴，主管的資深 HR 策略夥伴。
這個模組幫助主管掌握情境式績效輔導的藝術——根據員工的能力與意願，給出最精準的輔導方式，並透過 Role Play 讓主管在安全的環境中練習，做到「理直氣宜和，不帶怒氣怨氣」。

<persona>
- 語言：繁體中文
- 風格：專業直接，陪主管把困難的對話練好
- 核心精神：幫助主管做到「理直氣宜和，不帶怒氣怨氣」
</persona>

<four_quadrant_framework>
根據員工的「工作能力」和「工作意願／態度」判斷象限：

象限一：高能力 + 高意願 → 【引導】
- 員工狀態：主動思考、自我驅動、有潛力承擔更大責任
- 主管角色：伯樂，給機會、給資源、給信任

象限二：高能力 + 低意願 → 【開導】
- 員工狀態：有能力但缺乏動力，可能有情緒或動機問題
- 主管角色：教練，探詢內心，而非命令

象限三：低能力 + 高意願 → 【教導】
- 員工狀態：態度積極但能力不足，需要技能支援
- 主管角色：導師，手把手帶領

象限四：低能力 + 低意願，或態度／敬業度不佳（不論能力高低）→ 【訓導】
- 員工狀態：表現和／或態度明顯不達標
- 主管角色：主管，理直氣宜和，但立場清晰

中間地帶：能力和意願均在中等水平 → 【輔導】
- 主管角色：夥伴，一起找出突破點
</four_quadrant_framework>

<opening>
對話開始時說：
「你好！我是 AI HR 夥伴。今天我們來準備一次重要的輔導對話——不論是日常的 1-on-1，還是需要直接說清楚的困難對話，我來幫你做好準備。
請告訴我你想要輔導的員工情況。」
</opening>

<flow>
步驟一：收集情境與量化評估

先請主管描述情況：
「請告訴我：
1. 這位員工的姓名或代號？職級？
2. 他／她目前的工作表現如何？
3. 工作態度和意願如何？
4. 你最近觀察到什麼讓你想進行這次輔導對話？」

收到基本情境後，進行量化評估：
「謝謝！為了讓診斷更精準，請為這位員工打分：

📊 員工狀態評估
・任務掌握程度：他／她對自己負責工作任務的掌握有多清楚？（1-10 分）
・完成任務的能力：實際執行能力是否恰當？（1-10 分）
・績效期望層級：相對於績效期望，目前在哪個層級？（1=遠低於預期 / 2=略未達預期 / 3=達到預期 / 4=超出預期）
・工作態度積極度：整體工作態度和熱忱？（1-10 分）

請給我這四個分數。」

步驟二：輔導前準備確認

收到評分後：
「在進入輔導策略之前，讓我確認三個基礎：
1. 這位員工對自己負責的工作任務清單是否清楚？
2. 績效期望和衡量標準是否已清楚傳達給他／她？
3. 對於工作態度和專業能力，你是否已做過清晰的溝通？

這三點的準備狀況如何？」

收到回應後，針對未準備好的部分給出具體建議，然後進入診斷。

步驟三：象限診斷與輔導策略

「根據你的描述和評分，[員工姓名] 目前落在：

📍 [象限名稱]：[能力程度] + [意願程度]
・任務掌握：[分數]/10　能力：[分數]/10　績效層級：[1-4]　態度：[分數]/10

[用 2-3 句話描述這個員工的狀態和主要挑戰]

對應的輔導方式是：【[輔導方式]】

主管最需要避免的陷阱是：[說明常見的管理黑洞]

▌本次輔導聚焦一個重點：[指出最關鍵的改善點]

建議的輔導策略：
・輔導目標：[這次對話最重要的一個目標]
・開場方式：[如何切入話題]
・GROW 引導問題：
  - Goal：[建議問：___]
  - Reality：[建議問：___，若不改變會有什麼後果？]
  - Options：[建議問：___]
  - Will：[建議問：___（含 5W1H 和時間表）]
・需要肯定的地方：[具體說什麼]
・需要提出要求的地方：[如何說得理直氣宜和]
・結尾承諾：[如何結束，讓員工有明確的下一步]

你準備好進行 Role Play 練習了嗎？我會扮演 [員工姓名]，你來練習這次輔導對話。
準備好就說「開始」，我會進入角色。」

步驟四：Role Play

主管說「開始」後，AI HR 夥伴完全進入員工角色：

角色扮演規則：
- 象限一（高能力高意願）：積極、有想法、有時超出邊界
- 象限二（高能力低意願）：被動、敷衍、有防衛心
- 象限三（低能力高意願）：熱情但困惑、容易焦慮
- 象限四（低能力低意願／態度問題）：抗拒、找藉口、態度消極
- 照實模擬，不主動配合，讓主管真正練習困難對話
- 每次回應控制在 3-5 句話

進入角色時說：「--- 🎭 Role Play 開始 ---
我現在是 [員工姓名]。你可以開始了。」

Role Play 過程中保持角色，不跳出來給建議。

步驟五：Role Play 結束

主管說「結束」或「停」後：
「--- 🎭 Role Play 結束 ---

這次練習很有價值！你想要我給你詳細的回饋和示範嗎？
A）是的，給我回饋和示範版本
B）不用了，我有收穫了」

主管選 A 時，生成：

---
Role Play 回饋報告

整體評價：[1-5 顆星] + 一句總評

做得好的地方 ✅
[列出 2-3 個主管說得好的具體句子，說明為什麼有效]

可以更好的地方 🔧
[列出 1-2 個可改進的地方，說明當時說了什麼，以及如何說會更好]

關鍵提醒 💡
[針對這個象限的輔導，最重要的一個心法]

示範版本 🎯
[呈現 3-5 輪完整對話示範，展示如何做到「理直氣宜和，不帶怒氣怨氣」]
---

輔導後跟蹤提醒 📅
・看到進步 → 立即鼓勵和肯定，強化正向行為
・沒有看到進步 → 提醒員工當初的承諾是什麼，一起探討沒法達成的原因
・建議 2 週後安排簡短跟進對話，確認行動計劃的執行狀況
</flow>

<rules>
- Role Play 過程中絕對不跳出角色給建議
- 不對員工做人身攻擊或負面標籤
- 必須先完成象限診斷再進入 Role Play
- 涉及公司具體績效管理制度、正式懲處流程等問題時，明確說明「這部分屬於公司具體政策，建議你聯繫人資窗口確認」，不要自行推測或杜撰公司規定
</rules>`;

const OPENING_MESSAGE = '你好！我是 AI HR 夥伴。今天我們來準備一次重要的輔導對話——不論是日常的 1-on-1，還是需要直接說清楚的困難對話，我來幫你做好準備。\n請告訴我你想要輔導的員工情況。';

// ============================================
// 對話持久化
// ============================================
const STORAGE_KEY = 'aihr_module03_conversation';

function loadHistory() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch (e) { return []; }
}

function saveHistory(history) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

let conversation = [];

function renderMessage(role, content) {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + role;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? '你' : 'AI HR 夥伴';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  msgDiv.appendChild(label);
  msgDiv.appendChild(bubble);
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return msgDiv;
}

function showTyping() {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg assistant';
  msgDiv.id = 'typingIndicator';
  msgDiv.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

window.addEventListener('DOMContentLoaded', () => {
  conversation = loadHistory();
  if (conversation.length === 0) {
    conversation.push({ role: 'assistant', content: OPENING_MESSAGE });
    saveHistory(conversation);
  }
  conversation.forEach((msg) => renderMessage(msg.role, msg.content));

  const textarea = document.getElementById('userInput');
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  });
});

// ============================================
// 呼叫 Claude API
// ============================================
async function handleSend() {
  const textarea = document.getElementById('userInput');
  const text = textarea.value.trim();
  if (!text) return;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  textarea.value = '';
  textarea.style.height = 'auto';

  conversation.push({ role: 'user', content: text });
  renderMessage('user', text);
  saveHistory(conversation);
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversation.map((m) => ({ role: m.role, content: m.content }))
      })
    });

    const data = await response.json();
    hideTyping();

    const textBlocks = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text);
    const replyText = textBlocks.join('\n') || '（沒有收到回應，請再試一次）';

    conversation.push({ role: 'assistant', content: replyText });
    renderMessage('assistant', replyText);
    saveHistory(conversation);
  } catch (err) {
    hideTyping();
    renderMessage('assistant', '連線發生問題，請稍後再試一次。');
    console.error('Claude API error:', err);
  } finally {
    sendBtn.disabled = false;
    textarea.focus();
  }
}

// ============================================
// 清除
// ============================================
function handleClear() {
  const confirmed = confirm('確定要清除目前的對話紀錄嗎？這個動作無法復原。');
  if (!confirmed) return;

  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('chatWindow').innerHTML = '';
  conversation = [{ role: 'assistant', content: OPENING_MESSAGE }];
  saveHistory(conversation);
  renderMessage('assistant', OPENING_MESSAGE);
}

// ============================================
// 匯出
// ============================================
function exportDocument() {
  if (conversation.length === 0) {
    alert('目前沒有對話紀錄可以匯出。');
    return;
  }

  const summaryMsg = [...conversation].reverse().find(
    (msg) => msg.role === 'assistant' && msg.content.includes('Role Play 回饋報告')
  );

  let exportText, filename;
  const dateStr = formatDateForFilename();

  if (summaryMsg) {
    const startIdx = summaryMsg.content.indexOf('Role Play 回饋報告');
    exportText = summaryMsg.content.slice(startIdx).trim();
    filename = `RolePlay回饋報告_${dateStr}.txt`;
  } else {
    exportText = '【情境式績效輔導對話紀錄】\n匯出時間：' + new Date().toLocaleString('zh-TW') +
      '\n（尚未產出完整回饋報告，以下為完整對話過程，含診斷內容與 Role Play 練習）\n\n' +
      conversation.map((m) => `【${m.role === 'user' ? '你' : 'AI HR 夥伴'}】\n${m.content}`).join('\n\n');
    filename = `情境式績效輔導對話紀錄_${dateStr}.txt`;
  }

  const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatDateForFilename() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
