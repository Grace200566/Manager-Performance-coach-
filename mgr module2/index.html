<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組02｜偵測目標進度，團隊管理儀表板 · AI HR 夥伴</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E1A;
    --surface: #141829;
    --surface-2: #1B2036;
    --text-primary: #F0EDE4;
    --text-secondary: #9BA3BF;
    --text-muted: #6B7290;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --gold: #D4AF37;
    --gold-light: #F0D477;
    --gold-dark: #A9841F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
  }

  /* ── LOGIN ── */
  .login-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .login-overlay.hidden { display: none; }
  .login-box {
    width: 100%; max-width: 380px; padding: 48px 40px;
    border: 0.5px solid var(--border); border-radius: 20px;
    background: var(--surface); text-align: center;
  }
  .login-icon { font-size: 30px; margin-bottom: 20px; color: var(--gold-light); }
  .login-box h2 {
    font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 24px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .login-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.7; }
  .login-input {
    width: 100%; padding: 13px 16px; background: var(--surface-2);
    border: 0.5px solid var(--border); border-radius: 10px; color: #fff;
    font-size: 15px; font-family: 'Noto Sans TC', sans-serif; outline: none;
    margin-bottom: 14px; text-align: center; letter-spacing: 0.1em; transition: border-color 0.2s;
  }
  .login-input:focus { border-color: rgba(212,175,55,0.6); }
  .login-btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #1A1508; font-size: 14px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: opacity 0.2s;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-error { font-size: 12px; color: #f87171; margin-top: 10px; min-height: 18px; }
  .login-footer { margin-top: 28px; font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; }

  /* ── APP SHELL ── */
  .app {
    display: flex; flex-direction: column; height: 100vh;
    max-width: 760px; margin: 0 auto;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 0.5px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }

  .topbar-left { display: flex; align-items: center; gap: 12px; }

  .back-link {
    color: var(--text-muted); text-decoration: none; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px; transition: background 0.15s, color 0.15s;
  }
  .back-link:hover { background: var(--surface-2); color: var(--gold-light); }

  .topbar-title { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .topbar-title span { display: block; font-size: 10px; color: var(--gold); letter-spacing: 0.08em; margin-bottom: 2px; }

  .toolbar { display: flex; gap: 6px; }
  .tool-btn {
    font-size: 12px; padding: 6px 12px; border-radius: 20px;
    border: 0.5px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .tool-btn:hover { background: #232A46; border-color: var(--border-hover); color: var(--gold-light); }

  /* ── CHAT ── */
  .chat-window {
    flex: 1; overflow-y: auto; padding: 24px 18px;
    display: flex; flex-direction: column; gap: 16px;
    background: var(--bg);
  }

  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #1A1508; border-bottom-right-radius: 4px; font-weight: 500;
  }
  .msg.assistant .bubble {
    background: var(--surface); border: 0.5px solid var(--border);
    color: var(--text-primary); border-bottom-left-radius: 4px;
  }

  .msg-label { font-size: 10px; color: var(--text-muted); padding: 0 4px; }

  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ── INPUT ── */
  .input-bar {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 14px 18px; border-top: 0.5px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1; resize: none; border: 0.5px solid var(--border); border-radius: 14px;
    padding: 11px 14px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
    outline: none; max-height: 120px; line-height: 1.6; transition: border-color 0.15s;
    background: var(--surface-2); color: var(--text-primary);
  }
  .input-bar textarea::placeholder { color: var(--text-muted); }
  .input-bar textarea:focus { border-color: var(--gold); }
  .send-btn {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #1A1508; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: opacity 0.15s;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (max-width: 600px) {
    .chat-window { padding: 18px 14px; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">✦</div>
    <h2>Manager Portal</h2>
    <p>此系統僅供授權主管使用<br>請輸入存取密碼</p>
    <input type="password" class="login-input" id="passwordInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter') checkPassword()"/>
    <button class="login-btn" onclick="checkPassword()">進入系統</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-footer">AI 績效導航系統 · 授權存取</div>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-link" href="https://manager-performance-portal.vercel.app/" title="回 Manager Portal">←</a>
      <div class="topbar-title"><span>MODULE 02</span>偵測目標進度，團隊管理儀表板</div>
    </div>
    <div class="toolbar">
      <button class="tool-btn" onclick="exportDocument()">📥 匯出</button>
      <button class="tool-btn" onclick="handleClear()">🗑 清除</button>
    </div>
  </div>

  <div class="chat-window" id="chatWindow"></div>

  <div class="input-bar">
    <textarea id="userInput" rows="1" placeholder="輸入訊息，Enter 送出、Shift+Enter 換行"></textarea>
    <button class="send-btn" id="sendBtn" onclick="handleSend()">➤</button>
  </div>
</div>

<script>
// ============================================
// 登入
// ============================================
function checkPassword() {
  var input = document.getElementById('passwordInput').value;
  var error = document.getElementById('loginError');
  if (input === 'Gkgk0681') {
    document.getElementById('loginOverlay').classList.add('hidden');
    sessionStorage.setItem('mp_auth', '1');
  } else {
    error.textContent = '密碼錯誤，請重新輸入';
    document.getElementById('passwordInput').value = '';
  }
}

// 若從 Manager Portal 入口頁的授權連結進入，自動放行，不用再輸入一次密碼
(function tryAutoAuth() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('auth') === 'Gkgk0681') {
    sessionStorage.setItem('mp_auth', '1');
    var cleanUrl = window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);
  }
})();

if (sessionStorage.getItem('mp_auth') === '1') {
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.getElementById('loginOverlay');
    if (o) o.classList.add('hidden');
  });
}

// ============================================
// System Prompt（v1 通用版，無知識庫）
// ============================================
const SYSTEM_PROMPT = `你是 AI HR 夥伴，主管的資深 HR 策略夥伴。
這個模組幫助主管掌握團隊目標進度，提供客觀有深度的回饋，讓主管在 1-on-1 輔導和部門會議中都有充分的數據支撐。

你的定位：客觀有據，看見細節，說出有溫度的建議。

<persona>
- 語言：繁體中文
- 風格：客觀嚴謹，數據說話，但有溫度
- 嚴格禁止：主觀評判員工；只陳述行為和數據
</persona>

<opening>
對話開始時說：
「你好！我是 AI HR 夥伴。今天我們來掌握你的團隊進度。請告訴我你的部門、團隊人數，以及今年部門的核心目標是什麼？」
</opening>

<input_modes>
確認身份後，說明兩種輸入方式：

「現在開始分析你的團隊成員進度。你可以選擇：

📋 快速模式：直接把員工的 STAR 工作紀錄貼過來，我自動分析。
💬 對話模式：用你自己的話描述員工的工作表現，我來引導整理。

請告訴我第一位員工的姓名或代號和職級，我們開始。」
</input_modes>

<analysis_framework>
每位員工分析對照以下框架：

績效結果分析：
- 量：完成的工作量是否達標
- 品質：工作成果的品質
- 時效：是否按時完成

行為表現分析：
- 價值觀行為：積極主動程度、熱忱度
- 團隊合作：協作性、影響力
- AI 協作力：是否善用 AI 工具提升產出

綜合評級（1-4 分）：
- 4 分：表現遠超預期（當責）
- 3 分：表現達到預期（盡責）
- 2 分：表現略未達預期（負責）
- 1 分：表現遠低於預期（推責）
</analysis_framework>

<flow>
對話模式的引導問題：
「請告訴我這位員工最近 1-3 個月的工作情況：
1. 他／她主要負責什麼任務？完成得怎麼樣？
2. 工作態度和積極性如何？
3. 和團隊的合作情況？
4. 有沒有讓你印象深刻的事（好的或需要改進的）？」

每位員工分析完後詢問：
「[員工姓名] 的進度分析完成。你想要：
A）繼續輸入下一位員工
B）查看目前的團隊進度儀表板
C）針對這位員工深入討論（準備 1-on-1 輔導策略）

請選擇 A、B 或 C。」
</flow>

<dashboard_format>
當主管選擇 B 時，生成：

---
團隊進度儀表板
部門：___　主管：___　更新日期：___
已分析：X 位　／　全團隊：Y 位

一、團隊整體概況
[2-3 句話描述整體表現，點出亮點和需要關注的地方]

二、成員進度一覽
姓名／代號 | 職級 | 績效評級 | 主要亮點 | 需關注事項
[每位員工一行]

三、需要立即關注的成員
[評級 2 分或以下的員工，說明建議行動]

四、值得表揚的亮點
[評級 4 分的員工，說明值得分享的行為]

五、給主管的整體建議
[2-3 個具體的團隊管理建議]

尚未分析的成員：[列出還未輸入的成員]
---
</dashboard_format>

<oneonone_format>
當主管選擇 C 時，生成：

---
[員工姓名] 1-on-1 輔導準備清單

輔導目標：[根據分析結果，本次最重要的一個目標]

開場建議：[如何開場讓員工感到被重視]

GROW Model 引導問題：
・Goal（目標）：建議問：「___」
・Reality（現況）：建議問：「___」
・Options（選項）：建議問：「___」
・Will（行動）：建議問：「___」

需要肯定的地方：[具體說什麼]
需要提出改進的地方：[如何有溫度地說]
結尾承諾：[如何結束這次對話，讓員工有動力]
---
</oneonone_format>

<rules>
- 不對員工做負面標籤或人身攻擊
- 不跳過分析框架，每位員工都要完整分析
- 不承諾薪酬或晉升
- 涉及公司具體績效評核制度、薪酬、正式考核流程等問題時，明確說明「這部分屬於公司具體政策，建議你聯繫人資窗口確認」，不要自行推測或杜撰公司規定
</rules>`;

const OPENING_MESSAGE = '你好！我是 AI HR 夥伴。今天我們來掌握你的團隊進度。請告訴我你的部門、團隊人數，以及今年部門的核心目標是什麼？';

// ============================================
// 對話持久化
// ============================================
const STORAGE_KEY = 'aihr_module02_conversation';

function loadHistory() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch (e) { return []; }
}

function saveHistory(history) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

let conversation = [];

function renderMessage(role, content) {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + role;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? '你' : 'AI HR 夥伴';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  msgDiv.appendChild(label);
  msgDiv.appendChild(bubble);
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return msgDiv;
}

function showTyping() {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg assistant';
  msgDiv.id = 'typingIndicator';
  msgDiv.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

window.addEventListener('DOMContentLoaded', () => {
  conversation = loadHistory();
  if (conversation.length === 0) {
    conversation.push({ role: 'assistant', content: OPENING_MESSAGE });
    saveHistory(conversation);
  }
  conversation.forEach((msg) => renderMessage(msg.role, msg.content));

  const textarea = document.getElementById('userInput');
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  });
});

// ============================================
// 呼叫 Claude API
// ============================================
async function handleSend() {
  const textarea = document.getElementById('userInput');
  const text = textarea.value.trim();
  if (!text) return;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  textarea.value = '';
  textarea.style.height = 'auto';

  conversation.push({ role: 'user', content: text });
  renderMessage('user', text);
  saveHistory(conversation);
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversation.map((m) => ({ role: m.role, content: m.content }))
      })
    });

    const data = await response.json();
    hideTyping();

    const textBlocks = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text);
    const replyText = textBlocks.join('\n') || '（沒有收到回應，請再試一次）';

    conversation.push({ role: 'assistant', content: replyText });
    renderMessage('assistant', replyText);
    saveHistory(conversation);
  } catch (err) {
    hideTyping();
    renderMessage('assistant', '連線發生問題，請稍後再試一次。');
    console.error('Claude API error:', err);
  } finally {
    sendBtn.disabled = false;
    textarea.focus();
  }
}

// ============================================
// 清除
// ============================================
function handleClear() {
  const confirmed = confirm('確定要清除目前的對話紀錄嗎？這個動作無法復原。');
  if (!confirmed) return;

  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('chatWindow').innerHTML = '';
  conversation = [{ role: 'assistant', content: OPENING_MESSAGE }];
  saveHistory(conversation);
  renderMessage('assistant', OPENING_MESSAGE);
}

// ============================================
// 匯出
// ============================================
function exportDocument() {
  if (conversation.length === 0) {
    alert('目前沒有對話紀錄可以匯出。');
    return;
  }

  const summaryMsg = [...conversation].reverse().find(
    (msg) => msg.role === 'assistant' && (msg.content.includes('團隊進度儀表板') || msg.content.includes('1-on-1 輔導準備清單'))
  );

  let exportText, filename;
  const dateStr = formatDateForFilename();

  if (summaryMsg) {
    const reportType = summaryMsg.content.includes('團隊進度儀表板') ? '團隊進度儀表板' : '1-on-1 輔導準備清單';
    const startIdx = summaryMsg.content.indexOf(reportType);
    exportText = summaryMsg.content.slice(startIdx).trim();
    filename = `${reportType}_${dateStr}.txt`;
  } else {
    exportText = '【團隊進度分析對話紀錄】\n匯出時間：' + new Date().toLocaleString('zh-TW') +
      '\n（尚未產出完整儀表板或輔導清單，以下為完整對話過程）\n\n' +
      conversation.map((m) => `【${m.role === 'user' ? '你' : 'AI HR 夥伴'}】\n${m.content}`).join('\n\n');
    filename = `團隊進度分析對話紀錄_${dateStr}.txt`;
  }

  const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatDateForFilename() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
</script>

</body>
</html>
